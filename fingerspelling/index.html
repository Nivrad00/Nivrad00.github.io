<script type="text/javascript"> 
var word = ""; 
var j = 0; 
var speed = new Array(); 
var used_words = new Array();
var score = 0;
// boolean switches to control playback 
var newpage = false; // autostart first word (false = don't autostart) 
var playing; 
var iscorrect; 
var ischecked; 
speed[0] = 1000; // 1 second 
speed[1] = 666; // 2/3 second 
speed[2] = 333; // 1/3 second 
speed[3] = 200; // 1/5 second 
// default speed is medium 
speed_val = 3; 
var new_speed = speed[speed_val]; 
length_lim = 99; 
var all_letters = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"; 

var current_index = 0
var done = false 

function change_text() {
	done = false;
    iscorrect = false;
    ischecked = false; 
    var isUsed = false;
	if (document.getElementById('customText').value != "") {
		words = document.getElementById('customText').value.replace(/[^a-zA-Z\s]/gi, '').toUpperCase().split(/\s+/);
		console.log(words);
	}
	else
		words = default_words;
	if (document.getElementById('indexInput').value != "")
		current_index = parseInt(document.getElementById('indexInput').value);
	else
		current_index = 0
	document.forms[0].input.value = "";
	document.asl_words.input.focus();
	document.getElementById('story').innerHTML = " "
	document.getElementById('index').innerHTML = " "
	new_word();
}


function update_letter(current_word, i) { 
	if(playing == false || current_word != word) { return; }
	
	if(i >= word.length) { 
		document.images['ASLalphabet'].src="images/blank.gif"; 
		return; 
	} 
	if(all_letters.indexOf(word.charAt(i)) >= 0) { 
		// check for double letter 
		if(word.charAt(i) == word.charAt(i-1)) { 
			document.images['ASLalphabet'].src='images/' + word.charAt(i).toLowerCase() + word.charAt(i++).toLowerCase() + ".gif"; 
		} else { 
			document.images['ASLalphabet'].src='images/' + word.charAt(i++).toLowerCase() + ".gif"; 
		} 
	} else { 
		document.images['ASLalphabet'].src="images/blank.gif"; 
		i++;		 
	} 
	setTimeout(update_letter, new_speed, current_word, i); 
} 

function change_speed(speed_val_arg) { 
	new_speed = speed[speed_val_arg]; 
	change_speed2(); 
} 

function change_speed2() { 
	if (done) return;
	document.getElementById("speed").innerHTML = Math.round(1000 / new_speed * 100) / 100
	playing = true; 
	iscorrect = false; 
	ischecked = false; 
	document.asl_words.input.focus(); 
	update_letter(word, 0); 
} 

function set_speed(speed_val_arg) { 
	if (speed_val_arg == 0) { 
		new_speed = new_speed * 1.1; 
	} else 
	if (speed_val_arg == 1) { 
		new_speed = new_speed / 1.1; 
	} 
	change_speed2(); 
} 

function check_word() { 
	if (done) {
		return false;
	}
	
    if (ischecked && iscorrect) {
        // If answer was correct and check button (or Enter after correct answer) is pressed again
        new_word(); 
        return false; // Prevent default form submission
    } 

    if (ischecked && !iscorrect) {
        // If answer was wrong and user presses Enter, replay the word
        change_speed2(); 
        return false;
    }

    ischecked = true; // Mark the word as checked

    // Check the answer
    if (document.forms[0].input.value.toUpperCase() == word) {
        iscorrect = true; // Correct answer
		document.getElementById('story').innerHTML += word.toUpperCase() + " ";
		document.getElementById('index').innerHTML = "Progress: " + current_index + " / " + words.length;
        playing = false;
        new_word(); 
    } else {
        // Incorrect answer
        iscorrect = false;
        document.images['ASLalphabet'].src = "images/tryagain.png"; 
        playing = false;
    }

    document.asl_words.input.select();
    return false; // Prevent default form submission
}

function skip() {
	iscorrect = true; 
	document.getElementById('story').innerHTML += word.toUpperCase() + " ";
	document.getElementById('index').innerHTML = "Progress: " + current_index + " / " + words.length;
	playing = false;
	new_word(); 
}

function new_word() {
    iscorrect = false; // Reset on fetching a new word
    ischecked = false; // Allow new answer checking
    var isUsed = false;
    var k;
	if (current_index < words.length) {
		word = words[current_index].toUpperCase()
		current_index += 1
		document.forms[0].input.value = "";
		document.asl_words.input.focus();
		change_speed2();
	} else {
        document.images['ASLalphabet'].src = "images/goodjob.png"; 
		done = true;
	}
}

</script>

			<input class="button" name="submit" value="submit" onclick="change_text()" type="button" style="color: #FFFFFF; font-family: arial; border: 1px solid #FFAC1C; background-color: #000000"><p style="margin-top: 0; margin-bottom: 45px"> 
		</p>
		
		<p style="min-height: 24px; width:500px; line-height: 1.5; color: grey; font-size: 12px;  margin-bottom: 10px">
